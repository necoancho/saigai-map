<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>災害情報マップ</title>
<meta name="theme-color" content="#11161c">
<meta name="description" content="被害や危険箇所を撮影して、位置つきで共有する災害情報マップ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="災害マップ">
<link rel="stylesheet" href="lib/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ 撮影 ============ -->
<section class="screen cam" id="scr-camera" aria-label="撮影">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="canvas" hidden></canvas>

  <div class="cam-fallback" id="cam-fallback" hidden>
    <p id="cam-fallback-msg">カメラを開けませんでした。</p>
    <label class="big-btn" for="file-camera">カメラで撮影する</label>
  </div>

  <header class="cam-top">
    <button class="gps-chip" id="gps-chip" type="button"><span class="dot"></span><span id="gps-text">位置を取得中…</span></button>
    <div class="mode-chip" id="mode-chip" hidden>お試しモード</div>
  </header>

  <footer class="cam-bottom">
    <button class="round-btn" id="btn-to-map" type="button" aria-label="地図を見る">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Zm0 2.2 6 2v11.6l-6-2V6.2Z" fill="currentColor"/></svg>
      <span>地図</span>
    </button>
    <button class="shutter" id="btn-shutter" type="button" aria-label="撮影する"><span></span></button>
    <label class="round-btn" for="file-library" aria-label="写真を選ぶ">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4V5Zm2 2v8.6l3.5-3.5 2.5 2.5 3.5-4.5L18 13.6V7H6Z" fill="currentColor"/></svg>
      <span>写真</span>
    </label>
  </footer>
  <button class="text-btn nophoto" id="btn-nophoto" type="button">写真なしで投稿する</button>

  <input type="file" id="file-camera" accept="image/*" capture="environment" hidden>
  <input type="file" id="file-library" accept="image/*" hidden>
</section>

<!-- ============ 入力 ============ -->
<section class="screen form-scr" id="scr-form" hidden aria-label="入力">
  <header class="bar">
    <button class="bar-btn" id="btn-retake" type="button">‹ 撮り直す</button>
    <h1>情報を入力</h1>
    <span class="bar-spacer"></span>
  </header>
  <form id="post-form" novalidate>
    <div class="photo-wrap" id="photo-wrap">
      <img id="photo-preview" alt="撮影した写真">
    </div>

    <div class="block">
      <div class="label-row"><span class="label">場所</span><span class="loc-note" id="loc-note">位置を取得中…</span></div>
      <div class="minimap" id="minimap"></div>
      <div class="loc-actions">
        <span class="hint">ピンを動かして位置を直せます</span>
        <button class="chip-btn" type="button" id="btn-loc-reset">現在地に戻す</button>
      </div>
      <input class="input" type="text" id="f-place" maxlength="120" placeholder="目印（任意）例：公民館の南、県道沿いの橋" autocomplete="off">
    </div>

    <div class="block">
      <span class="label">種類</span>
      <div class="cat-grid" id="cat-grid"></div>
    </div>

    <div class="block">
      <span class="label">緊急度</span>
      <div class="seg" id="level-seg"></div>
    </div>

    <div class="block">
      <label class="label" for="f-text">状況</label>
      <textarea class="input" id="f-text" rows="4" maxlength="1000" placeholder="見たこと・確認できたこと（例：道路が約30cm冠水、車は通行できない）"></textarea>
    </div>

    <div class="block">
      <label class="label" for="f-name">投稿者名（任意）</label>
      <input class="input" type="text" id="f-name" maxlength="30" placeholder="例：松永3班 山田" autocomplete="nickname">
    </div>

    <p class="err" id="f-err" hidden></p>
    <div class="submit-bar">
      <button class="primary" id="btn-submit" type="submit">投稿する</button>
    </div>
  </form>
</section>

<!-- ============ 地図 ============ -->
<section class="screen map-scr" id="scr-map" data-sheet="min" hidden aria-label="地図">
  <header class="bar map-bar">
    <div class="map-title">
      <h1 id="map-title">災害情報マップ</h1>
      <p class="counts"><span class="cnt-urgent">緊急 <b id="c-urgent">0</b></span><span>対応中 <b id="c-open">0</b></span><span>全 <b id="c-all">0</b></span></p>
    </div>
  </header>
  <div class="bigmap" id="bigmap"></div>
  <button class="locate-btn" id="btn-locate" type="button" aria-label="現在地を表示">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm9 3h-2.07A7 7 0 0 0 13 5.07V3h-2v2.07A7 7 0 0 0 5.07 11H3v2h2.07A7 7 0 0 0 11 18.93V21h2v-2.07A7 7 0 0 0 18.93 13H21v-2Zm-9 6a5 5 0 1 1 0-10 5 5 0 0 1 0 10Z" fill="currentColor"/></svg>
  </button>

  <div class="sheet-list" id="sheet-list">
    <button class="grabber" id="btn-sheet" type="button" aria-expanded="false" aria-label="投稿一覧を開く（上下にスライドで大きさを変更）"><span></span><b id="sheet-label">投稿一覧</b></button>
    <div class="list-tools">
      <div class="filters" id="filters"></div>
      <label class="toggle"><input type="checkbox" id="show-done"> 解消済みも表示</label>
    </div>
    <ul class="list" id="list"></ul>
    <p class="empty" id="empty" hidden></p>
  </div>

  <button class="fab" id="btn-to-camera" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 7.2 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.2L15 4H9Zm3 4.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z" fill="currentColor"/></svg>
    撮影して投稿
  </button>
</section>

<!-- 詳細 -->
<div class="modal" id="detail-modal" hidden>
  <div class="modal-card detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="d-title"></div>
</div>

<!-- 合言葉 -->
<div class="modal" id="join-modal" hidden>
  <form class="modal-card join" id="join-form" novalidate>
    <h2>合言葉を入力してください</h2>
    <p>投稿できるのは、合言葉を知っている関係者だけです。一度入力すると、この端末では次回から入力不要です。</p>
    <input class="input" type="text" id="join-code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="合言葉">
    <p class="err" id="join-err" hidden></p>
    <div class="modal-actions">
      <button class="text-btn" type="button" id="join-cancel">あとで</button>
      <button class="primary" type="submit" id="join-submit">確認して投稿</button>
    </div>
  </form>
</div>

<!-- 位置情報のヘルプ -->
<div class="modal" id="gps-help" hidden>
  <div class="modal-card gps-help" role="dialog" aria-modal="true" aria-labelledby="gps-help-title">
    <h2 id="gps-help-title">位置情報を使うには</h2>
    <div id="gps-help-body"></div>
    <div class="modal-actions">
      <button class="text-btn" type="button" id="gps-close">閉じる</button>
      <button class="primary" type="button" id="gps-retry">もう一度試す</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="lib/leaflet/leaflet.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
